<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Інтернет-магазин техніки</title>
</head>
<body>

    <header>
        <h1>Інтернет-магазин техніки</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="catalog.html">Каталог товарів</a></li>
                <li><a href="delivery.html">Умови доставки</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article>
            <h2>Ноутбук</h2>
            <img src="laptop.jpg" alt="Ноутбук для навчання та роботи сірого кольору">
            <p>Ноутбук для навчання та роботи.</p>
        </article>

        <section>
            <h2>Оформлення замовлення</h2>
            <form action="#" method="post">
                <p>
                    <label for="user-name">Ім'я:</label><br>
                    <input type="text" id="user-name" name="user-name" required>
                </p>
                <p>
                    <label for="quantity">Кількість:</label><br>
                    <input type="number" id="quantity" name="quantity" min="1" value="1" required>
                </p>
                <p>
                    <button type="submit">Замовити</button>
                </p>
            </form>
        </section>
    </main>

    <!--
    Виправлені проблеми доступності:
    1. Відсутність мови документа: додано атрибут lang="uk" до тегу <html>.
    2. Ієрархія заголовків: змінено <h2> та <h4> на послідовну структуру <h1> (головний заголовок сторінки) та <h2> (підзаголовки).
    3. Відсутність семантичної навігації: посилання загорнуто у тег <nav> та список <ul>/<li>.
    4. Неінформативні посилання: замінено «Натисніть тут» та «Детальніше» на зрозумілі назви «Каталог товарів» та «Умови доставки».
    5. Відсутність атрибута alt у зображення: додано описовий альтернативний текст alt="Ноутбук для навчання та роботи сірого кольору".
    6. Відсутність зв'язку полів форми з текстовими підписами: використано елементи <label> з атрибутом for, прив'язані до id відповідних полів <input>.
    7. Неправильний тип поля для кількості: змінено type="text" на type="number" із зазначенням мінімального значення min="1".
    8. Недоступна кнопка відправки форми: замінено неінтерактивний <div>Замовити</div> на справжній елемент <button type="submit">Замовити</button>, який доступний із клавіатури.
    9. Відсутність семантичної размітки основного вмісту: додано теги <header>, <main>, <article> та <section>.
    -->

</body>
</html>
